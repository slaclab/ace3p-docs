site_name: ACE3P Documentation
site_description: User documentation for ACE3P, SLAC's parallel finite-element electromagnetic simulation suite
# Overridden in CI from the Pages URL; see .github/workflows/docs.yml
site_url: !ENV [SITE_URL, 'https://slaclab.github.io/ace3p-docs/']
repo_url: https://github.com/slaclab/ace3p-docs
repo_name: slaclab/ace3p-docs
edit_uri: edit/main/docs/
copyright: Copyright &copy; SLAC National Accelerator Laboratory. Documentation licensed <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  version:
    provider: mike
    default: latest

# Pages kept in the tree but not published: prototype interfaces, and the
# corrections log (an internal to-do list for the source material)
exclude_docs: |
  interfaces/dashboard.md
  interfaces/workflow-assistant.md
  corrections.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.blocks.caption
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Running on NERSC Perlmutter: getting-started/perlmutter.md
      - Pre- and post-processing tools:
          - getting-started/tools/index.md
          - Cubit: getting-started/tools/cubit.md
          - ParaView: getting-started/tools/paraview.md
      - Running on S3DF (SLAC users): getting-started/s3df.md
  - Workflow:
      - workflow/index.md
      - Mesh preparation with acdtool: workflow/mesh.md
      - Input file format: workflow/input-format.md
      - Batch jobs: workflow/batch-jobs.md
  - Modules:
      - modules/index.md
      - Omega3P:
          - Introduction: modules/omega3p/index.md
          - Tutorials:
              - "1. Pillbox cavity": modules/omega3p/tutorial-pillbox.md
              - "2. Coax coupler and ports": modules/omega3p/tutorial-ports.md
              - "3. Lossy load and periodic boundaries": modules/omega3p/tutorial-advanced.md
          - Post-processing with acdtool: modules/omega3p/postprocess.md
      - S3P:
          - Introduction: modules/s3p/index.md
          - Tutorials: modules/s3p/tutorials.md
      - T3P:
          - Introduction: modules/t3p/index.md
          - Tutorials: modules/t3p/tutorials.md
      - Track3P:
          - Introduction: modules/track3p/index.md
          - Tutorials: modules/track3p/tutorials.md
          - Notes from the source tree: modules/track3p/from-source/index.md
      - Pic3P:
          - Introduction: modules/pic3p/index.md
          - Tutorials: modules/pic3p/tutorial.md
      - TEM3P:
          - Introduction: modules/tem3p/index.md
          - Tutorials: modules/tem3p/tutorials.md
      - Gun3P:
          - Introduction: modules/gun3p/index.md
          - Tutorials: modules/gun3p/tutorial.md
          - Notes from the source tree: modules/gun3p/from-source/index.md
  - Reference:
      - reference/index.md
      - Command syntax:
          - Omega3P: reference/commands/omega3p.md
          - S3P: reference/commands/s3p.md
          - T3P: reference/commands/t3p.md
          - Pic3P: reference/commands/pic3p.md
          - Track3P: reference/commands/track3p.md
          - TEM3P: reference/commands/tem3p.md
          - Gun3P: reference/commands/gun3p.md
          - acdtool: reference/commands/acdtool.md
      - Keyword tables:
          - Omega3P: reference/omega3p.md
          - S3P: reference/s3p.md
          - T3P and Pic3P: reference/tfe3p.md
          - Track3P: reference/multipacting.md
          - TEM3P: reference/tem3p.md
          - Gun3P: reference/gun3p.md
          - acdtool: reference/tools.md
          - acdtool rf post-processor: reference/omega3p-postprocess.md
          - Shared EM (emfem): reference/emfem.md
          - Eigensolvers (solver): reference/solver.md
          - Excitation pulses: reference/excitation.md
          - Waveguide ports: reference/waveguide.md
          - Bunch shapes (slacsupport): reference/slacsupport.md
  - Interfaces:
      - interfaces/index.md
      - ACE3P GUI: interfaces/gui.md
  # BEGIN generated nav (tools/assemble_source_docs.py; do not edit by hand)
  - Releases:
      - releases/index.md
      - ACE3P v2026.11: releases/v2026.11.md
      - ACE3P v2026.10: releases/v2026.10.md
  # END generated nav
  - Contributing: contributing.md
