site_name: ACE3P Documentation
site_description: User documentation for ACE3P, SLAC's parallel finite-element electromagnetic simulation suite
# Overridden in CI from the Pages URL; see .github/workflows/docs.yml
site_url: !ENV [SITE_URL, 'https://slaclab.github.io/ace3p-docs/']
repo_url: https://github.com/slaclab/ace3p-docs
repo_name: slaclab/ace3p-docs
edit_uri: edit/main/docs/
copyright: Copyright &copy; SLAC National Accelerator Laboratory. Documentation licensed <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  version:
    provider: mike
    default: latest

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.blocks.caption
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Running on NERSC Perlmutter: getting-started/perlmutter.md
      - Pre- and post-processing tools (Cubit, ParaView): getting-started/tools.md
      - Running on S3DF (SLAC users): getting-started/s3df.md
  - Cubit:
      - cubit/index.md
  - Workflow:
      - workflow/index.md
      - Mesh preparation with acdtool: workflow/mesh.md
      - Input file format: workflow/input-format.md
      - Batch jobs: workflow/batch-jobs.md
  - Modules:
      - modules/index.md
      - Omega3P:
          - modules/omega3p/index.md
          - "Tutorial 1: pillbox-rtop": modules/omega3p/tutorial-pillbox.md
          - "Tutorial 2: coax coupler and ports": modules/omega3p/tutorial-ports.md
          - "Tutorial 3: lossy load and periodic boundaries": modules/omega3p/tutorial-advanced.md
          - Post-processing with acdtool: modules/omega3p/postprocess.md
      - S3P:
          - modules/s3p/index.md
          - Tutorials: modules/s3p/tutorials.md
      - T3P:
          - modules/t3p/index.md
          - Tutorials: modules/t3p/tutorials.md
      - Track3P:
          - modules/track3p/index.md
          - Tutorials: modules/track3p/tutorials.md
      - Pic3P:
          - modules/pic3p/index.md
          - "Tutorial: LCLS RF gun": modules/pic3p/tutorial.md
      - TEM3P:
          - modules/tem3p/index.md
          - Tutorials: modules/tem3p/tutorials.md
      - Gun3P:
          - modules/gun3p/index.md
          - "Tutorial: sheet beam klystron gun": modules/gun3p/tutorial.md
  - Reference:
      - reference/index.md
      - Omega3P keywords: reference/omega3p.md
      - S3P keywords: reference/s3p.md
      - T3P and Pic3P keywords: reference/tfe3p.md
      - Track3P keywords: reference/multipacting.md
      - TEM3P keywords: reference/tem3p.md
      - Gun3P keywords: reference/gun3p.md
      - acdtool keywords: reference/tools.md
      - acdtool rf post-processor keywords: reference/omega3p-postprocess.md
      - Shared EM keywords (emfem): reference/emfem.md
      - Eigensolver keywords: reference/solver.md
      - Excitation pulse keywords: reference/excitation.md
      - Waveguide port keywords: reference/waveguide.md
      - Bunch shape keywords (slacsupport): reference/slacsupport.md
      - Command syntax:
          - Omega3P: reference/commands/omega3p.md
          - S3P: reference/commands/s3p.md
          - T3P: reference/commands/t3p.md
          - Pic3P: reference/commands/pic3p.md
          - Track3P: reference/commands/track3p.md
          - TEM3P: reference/commands/tem3p.md
          - Gun3P: reference/commands/gun3p.md
          - acdtool: reference/commands/acdtool.md
  - Interfaces:
      - interfaces/index.md
      - ACE3P GUI: interfaces/gui.md
      - Web dashboard: interfaces/dashboard.md
      - AI workflow assistant: interfaces/workflow-assistant.md
  # BEGIN generated nav (tools/assemble_source_docs.py; do not edit by hand)
  - Releases:
      - releases/index.md
      - ACE3P v2026.10: releases/v2026.10.md
  # END generated nav
  - Contributing: contributing.md
  - Corrections to source material: corrections.md
